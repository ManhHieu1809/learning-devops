services:
  mariadb:
    image: mariadb:11.8
    container_name: devops-learning-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: devops_learning
      MARIADB_USER: devops_app
      MARIADB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  mariadb_data:
