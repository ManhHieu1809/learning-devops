spring:
  application:
    name: devops-learning-api
  datasource:
    url: ${APP_DB_URL:jdbc:mariadb://localhost:3306/devops_learning}
    username: ${APP_DB_USERNAME:devops_app}
    password: ${APP_DB_PASSWORD:change-me-before-running}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: ${APP_FLYWAY_LOCATIONS:filesystem:../database/migrations}
  jackson:
    default-property-inclusion: non_null
server:
  port: ${APP_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${APP_COOKIE_SECURE:false}
app:
  cors-origin: ${APP_CORS_ORIGIN:http://127.0.0.1:3000}
  content-manifest: ${APP_CONTENT_MANIFEST:../docs/backend/content-manifest.snapshot.json}
  bootstrap:
    username: ${APP_BOOTSTRAP_USERNAME:}
    password: ${APP_BOOTSTRAP_PASSWORD:}
